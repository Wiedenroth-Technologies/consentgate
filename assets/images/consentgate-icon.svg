<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#ECEEF2"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#344078"/>
      <stop offset="100%" stop-color="#1C2542"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFAA72"/>
      <stop offset="100%" stop-color="#F9873E"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1C2542" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="96" fill="none" stroke="#E1E4EA" stroke-width="2"/>

  <!-- Schild: etwas schmaler -->
  <g filter="url(#shadow)">
    <path d="M256,72
             C256,72 170,100 96,120
             L96,272
             C96,368 166,418 256,438
             C346,418 416,368 416,272
             L416,120
             C342,100 256,72 256,72 Z"
          fill="url(#navyGrad)"/>
  </g>

  <!-- Schloss, mittig -->
  <g transform="translate(256,256)">
    <path d="M-40,-4 v-35 a40,40 0 0 1 80,0 v35" fill="none" stroke="url(#orangeGrad)" stroke-width="18" stroke-linecap="round"/>
    <rect x="-60" y="-14" width="120" height="90" rx="18" fill="url(#orangeGrad)"/>
    <circle cx="0" cy="26" r="11" fill="#1C2542"/>
    <rect x="-5" y="26" width="10" height="24" rx="4" fill="#1C2542"/>
  </g>
</svg>
